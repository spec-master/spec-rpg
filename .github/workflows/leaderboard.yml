name: leaderboard
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  submit:
    if: startsWith(github.event.issue.title, '[score]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate & update leaderboard
        env:
          RESULT_FILE: /tmp/lb-result.md
        run: node scripts/lb-submit.js
      - name: Commit
        run: |
          if [ -f /tmp/lb-changed ]; then
            git config user.name "leaderboard-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/leaderboard.json
            git commit -m "leaderboard: issue #${{ github.event.issue.number }}"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 3; done
          fi
      - name: Reply & close
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file /tmp/lb-result.md
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
